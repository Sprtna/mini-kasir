<!DOCTYPE html>
<lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Kasir</title>
    <!-- Hubungkan file CSS di bawah ini -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Aplikasi Mini Kasir</h1>
        
        <div class="form-group">
            <input type="text" id="namaBarang" placeholder="Nama Barang">
            <input type="number" id="hargaBarang" placeholder="Harga (Rp)">
            <button onclick="tambahBarang()">Tambah</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Barang</th>
                    <th>Harga</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelKasir">
                <!-- Data barang masuk ke sini -->
            </tbody>
            <!-- Tambahkan tfoot di bawah ini -->
            <tfoot>
                <tr>
                    <th colspan="3" style="text-align: right;">Total:</th>
                    <th id="totalHarga">Rp 0</th>
                </tr>
            </tfoot>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
